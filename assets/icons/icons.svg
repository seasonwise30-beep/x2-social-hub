<svg xmlns="http://www.w3.org/2000/svg">

  <!-- HOME -->
  <symbol id="home" viewBox="0 0 24 24">
    <path d="M3 10.5L12 3l9 7.5V21h-6v-7H9v7H3z"
      fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>

  <!-- USER -->
  <symbol id="user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- SEARCH -->
  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="7"
      fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M16 16l5 5"
      stroke="currentColor" stroke-width="2"
      stroke-linecap="round"/>
  </symbol>

  <!-- ADD -->
  <symbol id="plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"
      stroke="currentColor" stroke-width="2"
      stroke-linecap="round"/>
  </symbol>

  <!-- HEART -->
  <symbol id="heart" viewBox="0 0 24 24">
    <path d="M20.8 8.7c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11a4.7 4.7 0 018.8-2.2 4.7 4.7 0 018.8 2.2z"
      fill="none" stroke="currentColor"
      stroke-width="1.8"/>
  </symbol>

  <!-- SEND -->
  <symbol id="send" viewBox="0 0 24 24">
    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"
      fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>

  <!-- INSTAGRAM -->
  <symbol id="instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5"
      fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4"
      fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1.2"
      fill="currentColor"/>
  </symbol>

  <!-- WHATSAPP -->
  <symbol id="whatsapp" viewBox="0 0 24 24">
    <path d="M20.5 11.7a8.5 8.5 0 01-12.6 7.4L3 21l1.9-4.7A8.5 8.5 0 1120.5 11.7z"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M9 8.5c.4 2.5 2.3 4.5 4.8 5.2l1.3-1.2 2 1c-.3 1.5-1.4 2.2-2.8 2-3.5-.7-6.2-3.5-6.8-6.8-.2-1.3.6-2.4 2-2.7l1 2z"
      fill="currentColor"/>
  </symbol>

  <!-- FACEBOOK -->
  <symbol id="facebook" viewBox="0 0 24 24">
    <path d="M14 21v-8h3l.5-3H14V8c0-1 .4-1.5 1.7-1.5H18V4h-2.8C12.5 4 11 5.5 11 8v2H8v3h3v8z"
      fill="currentColor"/>
  </symbol>

  <!-- TELEGRAM -->
  <symbol id="telegram" viewBox="0 0 24 24">
    <path d="M22 3L2.5 10.5l7 2.5L12 20l3-5 5-12z"
      fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M9.5 13L19 6"
      stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- X -->
  <symbol id="x-social" viewBox="0 0 24 24">
    <path d="M3 3l18 18M21 3L3 21"
      stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- YOUTUBE -->
  <symbol id="youtube" viewBox="0 0 24 24">
    <rect x="2" y="5" width="20" height="14" rx="4"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M10 9l5 3-5 3z" fill="currentColor"/>
  </symbol>

  <!-- TIKTOK -->
  <symbol id="tiktok" viewBox="0 0 24 24">
    <path d="M14 3v12a4 4 0 11-4-4M14 3c1 3 3 5 6 5"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- EMAIL -->
  <symbol id="email" viewBox="0 0 24 24">
    <rect x="2" y="4" width="20" height="16" rx="2"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M3 6l9 7 9-7"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- SHARE -->
  <symbol id="share" viewBox="0 0 24 24">
    <circle cx="18" cy="5" r="3"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="6" cy="12" r="3"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="18" cy="19" r="3"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M8.7 10.5l6.6-4M8.7 13.5l6.6 4"
      stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- DOWNLOAD -->
  <symbol id="download" viewBox="0 0 24 24">
    <path d="M12 3v12m-5-5l5 5 5-5M4 20h16"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- SETTINGS -->
  <symbol id="settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M19 13.5l2-1.5-2-1.5-.5-2.5-2.5-.5L14.5 5h-5L8 7.5l-2.5.5L5 10.5 3 12l2 1.5.5 2.5 2.5.5L9.5 19h5l1.5-2.5 2.5-.5z"
      fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <!-- INFO -->
  <symbol id="info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 11v6m0-10h.01"
      stroke="currentColor" stroke-width="2"
      stroke-linecap="round"/>
  </symbol>

  <!-- HELP -->
  <symbol id="help" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M9 9a3 3 0 016 1c0 2-3 2-3 4m0 3h.01"
      fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- MUSIC -->
  <symbol id="music" viewBox="0 0 24 24">
    <path d="M9 18V5l12-2v13"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="6" cy="18" r="3"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="18" cy="16" r="3"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- PLAY -->
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M7 4l14 8-14 8z" fill="currentColor"/>
  </symbol>

  <!-- PAUSE -->
  <symbol id="pause" viewBox="0 0 24 24">
    <path d="M6 4h4v16H6zM14 4h4v16h-4z"
      fill="currentColor"/>
  </symbol>

  <!-- NEXT -->
  <symbol id="next" viewBox="0 0 24 24">
    <path d="M4 4l12 8-12 8zM19 4v16"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- PREVIOUS -->
  <symbol id="previous" viewBox="0 0 24 24">
    <path d="M20 4L8 12l12 8zM5 4v16"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- VOLUME -->
  <symbol id="volume" viewBox="0 0 24 24">
    <path d="M3 9v6h4l5 4V5L7 9z"
      fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M16 9a5 5 0 010 6m2-9a9 9 0 010 12"
      fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

</svg>
